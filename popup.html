<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImgPrompt AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-y: scroll; scrollbar-width: thin; scrollbar-color: rgba(124,106,247,.5) transparent; }

    body {
      width: 360px;
      background: #0e0e12;
      color: #e8ecf2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #7c6af7, #06b6d4);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .brand-name { font-size: 13px; font-weight: 700; color: #c4b5fd; letter-spacing: 0.01em; }
    .brand-ver  { font-size: 10px; color: #475569; margin-left: 2px; }

    .header-icons { display: flex; gap: 4px; }
    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px;
      transition: all 0.16s;
      color: rgba(200,210,230,0.7);
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); color: #e8ecf2; }
    .icon-btn.active {
      background: rgba(124,106,247,0.2);
      border-color: rgba(124,106,247,0.4);
      color: #a78bfa;
    }

    .user-row { display: flex; align-items: center; gap: 8px; }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #7c6af7, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .user-info h3 { font-size: 13px; font-weight: 600; color: #e2e8f0; }
    .user-info p  { font-size: 10px; color: #64748b; }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #475569;
      margin-left: auto;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }


    /* ── Donate button ── */
    .donate-btn {
      width: 100%; height: 36px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.1));
      border: 1px solid rgba(251,191,36,0.3);
      color: #fbbf24; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 8px; letter-spacing: 0.01em;
    }
    .donate-btn:hover {
      background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(245,158,11,0.18));
      border-color: rgba(251,191,36,0.55);
      box-shadow: 0 0 12px rgba(251,191,36,0.15);
      transform: translateY(-1px);
    }
    .donate-btn:active { transform: translateY(0); }

    /* Section labels */
    .section-label {
      font-size: 11px; font-weight: 600; color: #475569;
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .vision-badge {
      font-size: 9px; font-weight: 700; color: #f97316;
      background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.25);
      padding: 2px 6px; border-radius: 6px; letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Model chips */
    .model-chips-section { margin-bottom: 14px; max-height: 120px; overflow-y: auto; }
    .chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 5px 11px; border-radius: 20px;
      font-size: 11px; font-weight: 500; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #64748b; transition: all 0.16s;
      display: flex; align-items: center; gap: 4px;
    }
    .chip:hover { border-color: rgba(124,106,247,0.4); color: #a78bfa; }
    .chip.active {
      background: rgba(124,106,247,0.18);
      border-color: rgba(124,106,247,0.5);
      color: #c4b5fd;
    }
    .chip.qwen:hover  { border-color: rgba(118,185,0,0.4); color: #a3e635; }
    .chip.qwen.active { background: rgba(118,185,0,0.15); border-color: rgba(118,185,0,0.5); color: #a3e635; }
    .chip.gemini:hover  { border-color: rgba(66,133,244,0.4); color: #93c5fd; }
    .chip.gemini.active { background: rgba(66,133,244,0.12); border-color: rgba(66,133,244,0.45); color: #93c5fd; }
    .chip.openai:hover  { border-color: rgba(16,185,129,0.4); color: #6ee7b7; }
    .chip.openai.active { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.45); color: #6ee7b7; }
    .chip.mistral:hover  { border-color: rgba(249,115,22,0.4); color: #fb923c; }
    .chip.mistral.active { background: rgba(249,115,22,0.12); border-color: rgba(249,115,22,0.45); color: #fb923c; }
    .chip.llama:hover  { border-color: rgba(6,182,212,0.4); color: #67e8f9; }
    .chip.llama.active { background: rgba(6,182,212,0.12); border-color: rgba(6,182,212,0.45); color: #67e8f9; }
    .badge {
      font-size: 8px; font-weight: 700; color: #10b981;
      background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3);
      padding: 1px 4px; border-radius: 4px; letter-spacing: 0.05em;
    }
    .badge.paid {
      color: #f97316;
      background: rgba(249,115,22,0.12); border-color: rgba(249,115,22,0.3);
    }
    .hist-thumb-ph {
      width: 44px; height: 44px; border-radius: 8px;
      background: #1e1e2a; display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
    }

    /* Divider */
    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px 0; }

    /* Fields */
    .field { margin-bottom: 12px; }
    .field-label {
      font-size: 12px; font-weight: 600; color: #94a3b8;
      margin-bottom: 6px; display: flex; align-items: center;
      justify-content: space-between;
    }
    .field-hint { font-size: 10px; color: #475569; font-weight: 400; }
    .field-input {
      width: 100%; height: 42px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: #e2e8f0;
      padding: 0 14px; font-size: 13px;
      font-family: inherit; outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .field-input::placeholder { color: #334155; }
    .field-input:focus {
      border-color: rgba(124,106,247,0.5);
      box-shadow: 0 0 0 3px rgba(124,106,247,0.1);
    }
    .field-input.has-value { border-color: rgba(124,106,247,0.3); }
    .field-input.key { font-family: 'Courier New', monospace; font-size: 12px; }
    .field-row { display: flex; gap: 6px; }
    .field-row .field-input { flex: 1; }

    .reveal-btn {
      width: 42px; height: 42px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #64748b; cursor: pointer; font-size: 16px;
      transition: all 0.16s; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .reveal-btn:hover { border-color: rgba(124,106,247,0.4); color: #a78bfa; }

    /* ── Profile buttons ── */
    .profile-row {
      display: flex; gap: 6px; margin-bottom: 10px;
    }
    .profile-btn {
      flex: 1; height: 36px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #64748b; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .profile-btn:hover { background: rgba(255,255,255,0.08); color: #94a3b8; }
    .profile-btn.active {
      background: rgba(124,106,247,0.15);
      border-color: rgba(124,106,247,0.45);
      color: #a78bfa;
    }
    .profile-btn.groq.active {
      background: rgba(6,182,212,0.12);
      border-color: rgba(6,182,212,0.4);
      color: #67e8f9;
    }

    .profile-btn.local.active {
      background: rgba(6,182,212,0.12);
      border-color: rgba(6,182,212,0.4);
      color: #67e8f9;
    }

    .key-status.ok  { color: #10b981; }
    .key-status.err { color: #ef4444; }

    /* Test button */
    .test-btn {
      width: 100%; height: 46px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      gap: 7px; margin-top: 6px;
      box-shadow: 0 4px 18px rgba(249,115,22,0.3);
    }
    .test-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(249,115,22,0.4); }
    .test-btn:active { transform: translateY(0); }
    .test-btn.loading { background: rgba(249,115,22,0.5); cursor: default; transform: none; }
    .test-btn.success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 18px rgba(16,185,129,0.3); }

    .test-result {
      margin-top: 10px; padding: 10px 12px;
      border-radius: 10px; font-size: 11.5px;
      line-height: 1.55; display: none; white-space: pre-line;
    }
    .test-result.ok  { display:block; background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); color:#6ee7b7; }
    .test-result.err { display:block; background:rgba(239,68,68,0.1);  border:1px solid rgba(239,68,68,0.3);  color:#fca5a5; }

    /* Save row */
    .save-row { display: flex; gap: 8px; margin-top: 10px; }
    .save-btn {
      flex: 1; height: 38px; border-radius: 10px; border: none;
      background: rgba(124,106,247,0.18);
      border: 1px solid rgba(124,106,247,0.35);
      color: #c4b5fd; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.16s;
    }
    .save-btn:hover { background: rgba(124,106,247,0.28); }
    .save-btn.saved { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: #6ee7b7; }

    .reset-btn {
      flex: 0; width: 80px; height: 38px; border-radius: 10px;
      border: 1px solid rgba(239,68,68,0.25);
      background: rgba(239,68,68,0.08);
      color: #fca5a5; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all 0.16s;
    }
    .reset-btn:hover { background: rgba(239,68,68,0.15); }
    .reset-btn.saved { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.3); color: #6ee7b7; }

    /* Spinner */
    .spinner {
      width:14px; height:14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── History section ── */
    #historySection { display: none; padding: 0 16px 16px; }
    .hist-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0 10px;
    }
    .hist-header-title { font-size: 13px; font-weight: 700; color: #e2e8f0; }
    .hist-header-actions { display: flex; gap: 8px; }
    .hist-link {
      font-size: 11px; color: #64748b; cursor: pointer;
      padding: 4px 8px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      transition: all 0.15s;
    }
    .hist-link:hover { color: #a78bfa; border-color: rgba(124,106,247,0.3); }
    .hist-link.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }

    .hist-list { max-height: 340px; overflow-y: auto; }
    .hist-list::-webkit-scrollbar { width: 4px; }
    .hist-list::-webkit-scrollbar-track { background: transparent; }
    .hist-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .hist-item {
      display: flex; gap: 10px; padding: 10px;
      border-radius: 10px; cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s; margin-bottom: 6px;
      background: rgba(255,255,255,0.03);
    }
    .hist-item:hover { background: rgba(124,106,247,0.08); border-color: rgba(124,106,247,0.2); }
    .hist-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #1e1e2a; }
    .hist-text { flex: 1; min-width: 0; }
    .hist-prompt { font-size: 11.5px; color: #cbd5e1; line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .hist-meta { font-size: 10px; color: #475569; margin-top: 4px; }
    .hist-empty { color: #475569; font-size: 12px; text-align: center; padding: 32px 0; line-height: 1.7; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-logo">🔮</div>
        <span class="brand-name">IMGPROMPT AI</span>
        <span class="brand-ver"></span>
      </div>
      <div class="header-icons">
        <div class="icon-btn" title="Открыть боковую панель" id="sidePanelBtn">⊟</div>
        <div class="icon-btn" title="История" id="histBtn">🕒</div>
        <div class="icon-btn" title="Проверить соединение" id="testIconBtn">↺</div>
        <div class="icon-btn active" title="Настройки">⚙</div>
      </div>
    </div>
    <div class="user-row">
      <div class="user-avatar" id="userAvatar">OR</div>
      <div class="user-info">
        <h3 id="userName">OpenRouter</h3>
        <p>Your own API — no limits</p>
      </div>
      <div class="status-dot" id="statusDot" title="Статус соединения"></div>
    </div>
  </div>


  <!-- Main section (settings) -->
  <div id="mainSection">
    <div class="content">


      <!-- API form -->
      <div id="apiForm">

        <!-- Provider profile switcher -->
        <div class="profile-row">
          <div class="profile-btn active" data-profile="openrouter" id="profileBtnOpenrouter">
            🌐 OpenRouter
          </div>
          <div class="profile-btn groq" data-profile="groq" id="profileBtnGroq">
            ⚡ Groq
          </div>
        </div>
        <div class="profile-row">
          <div class="profile-btn local" data-profile="ollama" id="profileBtnOllama">🦙 Ollama</div>
          <div class="profile-btn local" data-profile="lmstudio" id="profileBtnLmstudio">🖥 LM Studio</div>
          <div class="profile-btn local" data-profile="jan" id="profileBtnJan">🤖 Jan</div>
        </div>

        <!-- Vision model selector -->
        <div class="model-chips-section">
          <div class="section-label">
            <span>👁 Vision модели</span>
            <span class="vision-badge">нужна vision-совместимая</span>
          </div>
          <div class="chips-row" id="modelChips">
            <!-- filled by popup.js -->
          </div>
        </div>

        <div class="divider"></div>

        <!-- Base URL -->
        <div class="field">
          <label class="field-label">
            Base URL
            <span class="field-hint">без /chat/completions</span>
          </label>
          <input type="text" id="baseUrl" class="field-input"
            placeholder="https://openrouter.ai/api/v1" />
        </div>

        <!-- API Key -->
        <div class="field">
          <label class="field-label">
            API Key
            <span class="field-hint">хранится локально</span>
          </label>
          <div class="field-row">
            <input type="password" id="apiKey" class="field-input key"
              placeholder="sk-or-v1-..." autocomplete="off" />
            <button class="reveal-btn" id="revealBtn" title="Показать/скрыть">👁</button>
          </div>
          <div class="key-status" id="keyStatus"></div>
        </div>

        <!-- Model (manual input) -->
        <div class="field">
          <label class="field-label">
            Модель
            <span class="field-hint">или введите вручную</span>
          </label>
          <input type="text" id="modelInput" class="field-input"
            placeholder="provider/model-name" />
        </div>

        <!-- Test -->
        <button class="test-btn" id="testBtn">
          🧪 Проверить соединение
        </button>
        <div id="testResult" class="test-result"></div>

        <!-- Save / Reset -->
        <div class="save-row">
          <button class="save-btn" id="saveBtn">💾 Сохранить</button>
          <button class="reset-btn" id="resetBtn">↺ Сброс</button>
        </div>

        <!-- Donate -->
        <button class="donate-btn" id="donateBtn">
          ☕ Поддержать автора
        </button>

      </div><!-- /apiForm -->
    </div>
  </div><!-- /mainSection -->

  <!-- History section -->
  <div id="historySection">
    <div class="hist-header">
      <span class="hist-header-title">🕒 История анализов</span>
      <div class="hist-header-actions">
        <span class="hist-link danger" id="clearHistBtn">🗑 Очистить</span>
        <span class="hist-link" id="backBtn">← Назад</span>
      </div>
    </div>
    <div class="hist-list" id="historyList">
      <div class="hist-empty">Загрузка...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
