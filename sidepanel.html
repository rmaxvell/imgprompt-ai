<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImgPrompt — История</title>
  <style>
    :root {
      --bg:      #0f0f13;
      --bg2:     #1a1a24;
      --bg3:     #22222f;
      --border:  rgba(255,255,255,0.07);
      --accent:  #7c6af7;
      --accent2: #a78bfa;
      --accent3: #06b6d4;
      --text:    #e2e8f0;
      --text2:   #94a3b8;
      --text3:   #475569;
      --ok:      #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Full-height root ── */
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    /* ── Wrapper fills viewport, column flex ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ── Fixed-size header ── */
    .header {
      flex: 0 0 auto;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      display: flex; align-items: center; gap: 8px;
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    h1 {
      font-size: 13px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      flex: 1;
    }
    .hdr-count {
      font-size: 10px; color: var(--text3);
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 7px;
    }
    .hdr-btn {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text2); font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .hdr-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .hdr-btn.danger:hover {
      background: rgba(239,68,68,0.12); color: #fca5a5;
      border-color: rgba(239,68,68,0.3);
    }

    /* ── Loading bar ── */
    .analysis-bar {
      flex: 0 0 auto;
      display: none;
      padding: 10px 14px;
      background: rgba(124,106,247,0.08);
      border-bottom: 1px solid rgba(124,106,247,0.2);
      align-items: center; gap: 10px;
    }
    .analysis-bar.visible { display: flex; }
    .spin {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid rgba(124,106,247,0.3);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .analysis-bar span { font-size: 11px; color: var(--accent2); flex: 1; }
    .cancel-analysis { border: 1px solid rgba(239,68,68,.35); background: transparent; color: #fca5a5; border-radius: 6px; padding: 4px 8px; font-size: 10px; cursor: pointer; }

    /* ── Scrollable area — THE KEY PART ── */
    #scrollArea {
      flex: 1 1 0;       /* grow to fill, start from 0 height */
      min-height: 0;     /* allow shrinking below content size */
      overflow-y: scroll;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Empty state ── */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 300px;
      gap: 12px; text-align: center; color: var(--text3);
      padding: 24px;
    }
    .empty .ico { font-size: 44px; }
    .empty p { font-size: 12px; line-height: 1.7; }
    .empty strong { color: var(--accent2); }

    /* ── Cards list ── */
    .list {
      padding: 10px;
      display: block;
    }

    /* ── Card ── */
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }
    .card:last-child { margin-bottom: 0; }
    .card:hover { border-color: rgba(124,106,247,0.3); }
    .card.new-anim { animation: cardIn 0.3s ease both; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-thumb-wrap {
      position: relative;
    }
    .card-thumb {
      width: 100%; height: 140px; object-fit: cover;
      display: block; background: var(--bg3);
    }
    .card-nothumb {
      width: 100%; height: 48px;
      background: linear-gradient(135deg, rgba(124,106,247,0.08), rgba(6,182,212,0.08));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: var(--text3);
    }

    /* Delete button — top-right corner of thumbnail */
    .btn-del {
      position: absolute; top: 6px; right: 6px;
      width: 26px; height: 26px; border-radius: 50%;
      border: none;
      background: rgba(15,15,19,0.75);
      color: #94a3b8; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      opacity: 0;
    }
    .card:hover .btn-del { opacity: 1; }
    .btn-del:hover {
      background: rgba(239,68,68,0.85);
      color: white;
    }

    .card-body { padding: 10px 12px; }

    .card-prompt {
      font-size: 11.5px; line-height: 1.6; color: var(--text);
      white-space: pre-wrap; word-break: break-word;
      user-select: text; -webkit-user-select: text;
      margin-bottom: 8px;
    }
    .card-prompt.collapsed {
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-toggle {
      font-size: 10px; color: var(--accent2);
      cursor: pointer; margin-bottom: 8px; display: inline-block;
    }
    .card-toggle:hover { text-decoration: underline; }

    .card-full {
      display: none;
      font-size: 11.5px; line-height: 1.75; color: var(--text2);
      white-space: pre-wrap; word-break: break-word;
      user-select: text; -webkit-user-select: text;
      border-top: 1px solid var(--border);
      padding-top: 8px; margin-top: 4px; margin-bottom: 8px;
    }
    .card-full strong { color: var(--accent2); }
    .card-full.open { display: block; }

    .card-footer { display: flex; gap: 6px; align-items: center; }

    .btn-copy {
      flex: 1; height: 30px; border-radius: 8px; border: none;
      background: linear-gradient(135deg, var(--accent), #6d28d9);
      color: white; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-copy:hover { opacity: 0.88; }
    .btn-copy.done { background: linear-gradient(135deg, var(--ok), #059669); }

    .btn-copy-all {
      flex: 1; height: 30px; border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text2); font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-copy-all:hover { border-color: rgba(124,106,247,0.4); color: var(--accent2); }
    .btn-copy-all.done {
      background: rgba(16,185,129,0.12);
      border-color: rgba(16,185,129,0.4); color: #6ee7b7;
    }

    .card-meta {
      font-size: 9.5px; color: var(--text3);
      display: flex; gap: 6px; align-items: center;
      padding: 6px 12px 10px;
      border-top: 1px solid var(--border);
    }
    .card-meta-model { color: rgba(124,106,247,0.6); }

    /* ── Scrollbar ── */
    #scrollArea::-webkit-scrollbar { width: 4px; }
    #scrollArea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    #scrollArea::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>

<div id="app">

  <div class="header">
    <div class="logo">🔮</div>
    <h1>ImgPrompt — История</h1>
    <span class="hdr-count" id="countBadge">0</span>
    <div class="hdr-btn" id="refreshBtn" title="Обновить">↺</div>
    <div class="hdr-btn danger" id="clearBtn" title="Очистить историю">🗑</div>
  </div>

  <div class="analysis-bar" id="analysisBar">
    <div class="spin"></div>
    <span>Анализируем изображение...</span><button class="cancel-analysis" id="cancelAnalysisBtn">Отмена</button>
  </div>

  <div id="scrollArea">

    <div class="empty" id="emptyState">
      <div class="ico">🖼️</div>
      <p>История пуста.<br>
      Наведи на картинку → нажми <strong>Prompt</strong><br>
      — результат появится здесь.</p>
    </div>

    <div class="list" id="histList" style="display:none"></div>

  </div><!-- /scrollArea -->

</div><!-- /app -->

<script src="sidepanel.js"></script>
</body>
</html>
